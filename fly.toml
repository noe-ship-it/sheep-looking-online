# fly launch --copy-config --no-deploy   (then: fly deploy)
app = "sheep-looking-online"
primary_region = "lhr"

[env]
  TRUST_PROXY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
